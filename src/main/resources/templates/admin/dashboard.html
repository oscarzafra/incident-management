<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel Administrador</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<h1>Panel de administración</h1>

<div class="acciones">
    <a class="btn btn-secundario" th:href="@{/}">Volver al inicio</a>
</div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Título</th>
        <th>Cliente</th>
        <th>Estado</th>
        <th>Técnico</th>
        <th>Asignar</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="incidence : ${incidences}">
        <td th:text="${incidence.id}"></td>
        <td th:text="${incidence.title}"></td>
        <td th:text="${incidence.client != null ? incidence.client.fullName : 'Sin cliente'}"></td>
        <td th:text="${incidence.status}"></td>
        <td th:text="${incidence.technician != null ? incidence.technician.fullName : 'Sin asignar'}"></td>
        <td>
            <form th:action="@{'/admin/incidences/' + ${incidence.id} + '/assign'}" method="post">
                <select name="technicianId" required>
                    <option value="">-- Técnico --</option>
                    <option th:each="tech : ${technicians}"
                            th:value="${tech.id}"
                            th:text="${tech.fullName}">
                    </option>
                </select>
                <button type="submit">Asignar</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
