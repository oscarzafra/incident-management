<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Incidencias asignadas</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<h1>Incidencias asignadas</h1>

<div th:if="${success == 'statusUpdated'}" class="mensaje-ok">
    El estado de la incidencia se ha actualizado correctamente.
</div>

<div class="acciones">
    <a class="btn btn-secundario" th:href="@{/}">Volver al inicio</a>
</div>

<div th:if="${#lists.isEmpty(incidences)}" class="sin-datos">
    No tienes incidencias asignadas actualmente.
</div>

<table th:if="${not #lists.isEmpty(incidences)}">
    <thead>
    <tr>
        <th>ID</th>
        <th>Título</th>
        <th>Descripción</th>
        <th>Estado</th>
        <th>Acción</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="incidence : ${incidences}">
        <td th:text="${incidence.id}"></td>
        <td th:text="${incidence.title}"></td>
        <td th:text="${incidence.description}"></td>
        <td th:text="${incidence.status}"></td>
        <td>
            <a class="btn" th:href="@{'/technician/incidences/' + ${incidence.id} + '/status'}">Cambiar estado</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
