<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Crear incidencia</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="container">
    <div class="page-header">
        <div>
            <h1>Crear incidencia</h1>
            <p class="subtitle">Registra una nueva incidencia técnica en el sistema.</p>
        </div>
    </div>

    <div class="actions">
        <a class="btn btn-outline" th:href="@{/incidences}">Volver</a>
    </div>

    <form th:action="@{/incidences/create}" th:object="${incidence}" method="post">
        <div class="form-grid">
            <div class="full">
                <label>Título</label>
                <input type="text" th:field="*{title}" placeholder="Ej. Fallo en central de alarma">
                <div class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
            </div>

            <div class="full">
                <label>Descripción</label>
                <textarea th:field="*{description}" placeholder="Describe el problema detectado"></textarea>
                <div class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
            </div>
        </div>

        <div class="floating-actions">
            <button type="submit">Guardar incidencia</button>
        </div>
    </form>
</div>
</body>
</html>
