version: "3.9"

services:
  db:
    image: postgres:16
    container_name: incident-db
    environment:
      POSTGRES_DB: incidencias_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: incident-app
    depends_on:
      - db
    environment:
      DB_URL: jdbc:postgresql://db:5432/incidencias_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    ports:
      - "8080:8080"

volumes:
  postgres_data: